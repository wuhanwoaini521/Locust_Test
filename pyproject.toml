[project]
name = "locust-test"
version = "0.1.0"
description = "基于 Python Locust 的性能测试/压测示例项目 🐝"
requires-python = ">=3.8"
dependencies = [
    "locust>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["unit_tests"]
pythonpath = ["."]
addopts = "-q"
